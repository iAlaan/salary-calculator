<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณเงินเดือนและ OT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">💰 ระบบคำนวณเงินเดือนและค่าล่วงเวลา (OT)</h1>
            <p class="text-slate-500 text-sm mb-6">ฐานการคำนวณ: (เงินเดือน / 30 / 8) × OT × จำนวนชั่วโมง</p>
            
            <!-- Tab Switching -->
            <div class="flex border-b border-slate-200 mb-6">
                <button onclick="switchTab('single')" id="btn-single" class="pb-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">👤 คำนวณรายบุคคล</button>
                <button onclick="switchTab('bulk')" id="btn-bulk" class="pb-3 px-4 font-medium text-slate-500 hover:text-slate-700 focus:outline-none">📁 อัปโหลดไฟล์ Excel (หลายคน)</button>
            </div>

            <!-- Single Calculation -->
            <div id="tab-single" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อพนักงาน</label>
                        <input type="text" id="s-name" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น สมชาย ใจดี">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ประเภทการรับเงิน</label>
                        <select id="s-type" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="monthly">เงินเดือน (Monthly)</option>
                            <option value="daily">เงินรายวัน (Daily)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">อัตราค่าจ้าง (บาท)</label>
                        <input type="number" id="s-base" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น 15000 หรือ 500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เรท OT ที่ทำ (ชั่วโมง)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div><span class="text-xs text-slate-500">OT 1.5</span><input type="number" id="s-ot15" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                            <div><span class="text-xs text-slate-500">OT 2.0</span><input type="number" id="s-ot2" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                            <div><span class="text-xs text-slate-500">OT 3.0</span><input type="number" id="s-ot3" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                        </div>
                    </div>
                </div>
                <button onclick="calculateSingle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">คำนวณเงินค่าจ้าง</button>
                
                <div id="s-result" class="hidden mt-4 p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <h3 class="font-bold text-blue-900 mb-2">ผลการคำนวณ</h3>
                    <div id="s-result-text" class="text-sm text-blue-800 space-y-1"></div>
                </div>
            </div>

            <!-- Bulk Excel Calculation -->
            <div id="tab-bulk" class="hidden space-y-4">
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer" onclick="document.getElementById('excel-file').click()">
                    <p class="text-slate-600 mb-1">คลิกเพื่ออัปโหลดไฟล์ Excel หรือลากไฟล์มาวางที่นี่</p>
                    <p class="text-xs text-slate-400">รองรับไฟล์ .xlsx หรือ .xls</p>
                    <input type="file" id="excel-file" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                </div>
                <div class="flex justify-between items-center">
                    <button onclick="downloadTemplate()" class="text-sm text-blue-600 hover:underline">📥 ดาวน์โหลดเทมเพลต Excel ตัวอย่าง</button>
                </div>

                <div id="bulk-result-section" class="hidden space-y-4">
                    <div class="overflow-x-auto border rounded-xl">
                        <table id="bulk-table" class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-50 border-b">
                                <tr>
                                    <th class="p-3">ชื่อพนักงาน</th>
                                    <th class="p-3">ประเภท</th>
                                    <th class="p-3">ฐานเงินเดือน</th>
                                    <th class="p-3">ค่า OT รวม</th>
                                    <th class="p-3">ยอดรวมสุทธิ</th>
                                </tr>
                            </thead>
                            <tbody id="bulk-tbody"></tbody>
                        </table>
                    </div>
                    <button onclick="exportResult()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">📥 ดาวน์โหลดผลลัพธ์เป็น Excel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bulkDataResult = [];

        function switchTab(tab) {
            if (tab === 'single') {
                document.getElementById('tab-single').classList.remove('hidden');
                document.getElementById('tab-bulk').classList.add('hidden');
                document.getElementById('btn-single').className = "pb-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none";
                document.getElementById('btn-bulk').className = "pb-3 px-4 font-medium text-slate-500 hover:text-slate-700 focus:outline-none";
            } else {
                document.getElementById('tab-single').classList.add('hidden');
                document.getElementById('tab-bulk').classList.remove('hidden');
                document.getElementById('btn-bulk').className = "pb-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none";
                document.getElementById('btn-single').className = "pb-3 px-4 font-medium text-slate-500 hover:text-slate-700 focus:outline-none";
            }
        }

        function computePay(type, base, ot15, ot2, ot3) {
            let hourlyRate = base / 30 / 8;
            let otPay = hourlyRate * ((ot15 * 1.5) + (ot2 * 2.0) + (ot3 * 3.0));
            let total = base + otPay;
            return { hourlyRate, otPay, total };
        }

        function calculateSingle() {
            let name = document.getElementById('s-name').value || 'พนักงานทั่วไป';
            let type = document.getElementById('s-type').value;
            let base = parseFloat(document.getElementById('s-base').value) || 0;
            let ot15 = parseFloat(document.getElementById('s-ot15').value) || 0;
            let ot2 = parseFloat(document.getElementById('s-ot2').value) || 0;
            let ot3 = parseFloat(document.getElementById('s-ot3').value) || 0;

            let res = computePay(type, base, ot15, ot2, ot3);

            let html = `
                <div><b>พนักงาน:</b> ${name} (${type === 'monthly' ? 'เงินเดือน' : 'รายวัน'})</div>
                <div><b>ค่าแรงต่อชั่วโมง:</b> ${res.hourlyRate.toFixed(2)} บาท/ชม.</div>
                <div><b>ค่า OT รวม:</b> ${res.otPay.toFixed(2)} บาท</div>
                <div class="text-base font-bold text-blue-900 mt-2 pt-2 border-t border-blue-200">ยอดรวมสุทธิ: ${res.total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท</div>
            `;
            document.getElementById('s-result-text').innerHTML = html;
            document.getElementById('s-result').classList.remove('hidden');
        }

        function downloadTemplate() {
            let wsData = [
                ["ชื่อพนักงาน", "ประเภท (monthly/daily)", "ฐานเงินเดือน", "OT 1.5 (ชม.)", "OT 2.0 (ชม.)", "OT 3.0 (ชม.)"],
                ["สมชาย ใจดี", "monthly", 15000, 10, 5, 2],
                ["สมหญิง รักงาน", "daily", 500, 8, 2, 0]
            ];
            let wb = XLSX.utils.book_new();
            let ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, "Payroll_Template.xlsx");
        }

        function handleExcelUpload(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(firstSheet);

                bulkDataResult = rows.map(r => {
                    let name = r["ชื่อพนักงาน"] || "ไม่ระบุ";
                    let type = r["ประเภท (monthly/daily)"] || "monthly";
                    let base = parseFloat(r["ฐานเงินเดือน"]) || 0;
                    let ot15 = parseFloat(r["OT 1.5 (ชม.)"]) || 0;
                    let ot2 = parseFloat(r["OT 2.0 (ชม.)"]) || 0;
                    let ot3 = parseFloat(r["OT 3.0 (ชม.)"]) || 0;

                    let calc = computePay(type, base, ot15, ot2, ot3);
                    return { name, type, base, otPay: calc.otPay, total: calc.total };
                });

                renderBulkTable();
            };
            reader.readAsArrayBuffer(file);
        }

        function renderBulkTable() {
            let tbody = document.getElementById('bulk-tbody');
            tbody.innerHTML = '';
            bulkDataResult.forEach(row => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 font-medium">${row.name}</td>
                    <td class="p-3">${row.type === 'monthly' ? 'เงินเดือน' : 'รายวัน'}</td>
                    <td class="p-3">${row.base.toLocaleString()}</td>
                    <td class="p-3">${row.otPay.toFixed(2)}</td>
                    <td class="p-3 font-bold text-blue-600">${row.total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('bulk-result-section').classList.remove('hidden');
        }

        function exportResult() {
            let exportData = bulkDataResult.map(r => ({
                "ชื่อพนักงาน": r.name,
                "ประเภท": r.type,
                "ฐานเงินเดือน": r.base,
                "ค่า OT รวม": r.otPay,
                "ยอดรวมสุทธิ": r.total
            }));
            let wb = XLSX.utils.book_new();
            let ws = XLSX.utils.json_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws, "Salary_Result");
            XLSX.writeFile(wb, "Payroll_Calculation_Result.xlsx");
        }
    </script>
</body>
</html>
