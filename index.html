<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคำนวณเงินเดือนและ OT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Sarabun', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">💰 ระบบคำนวณเงินเดือนและค่าล่วงเวลา (OT)</h1>
            <p class="text-slate-500 text-sm mb-6">ฐานการคำนวณ: (เงินเดือน / 30 / 8) × OT × จำนวนชั่วโมง</p>
            
            <!-- Tab Switching -->
            <div class="flex border-b border-slate-200 mb-6">
                <button onclick="switchTab('single')" id="btn-single" class="pb-3 px-4 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">👤 คำนวณรายบุคคล</button>
                <button onclick="switchTab('bulk')" id="btn-bulk" class="pb-3 px-4 font-medium text-slate-500 hover:text-slate-700 focus:outline-none">📁 อัปโหลดไฟล์ Excel (หลายคน)</button>
            </div>

            <!-- Single Calculation -->
            <div id="tab-single" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อพนักงาน</label>
                        <input type="text" id="s-name" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น สมชาย ใจดี">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ประเภทการรับเงิน</label>
                        <select id="s-type" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="monthly">เงินเดือน (Monthly)</option>
                            <option value="daily">เงินรายวัน (Daily)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">อัตราค่าจ้าง (บาท)</label>
                        <input type="number" id="s-base" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="เช่น 15000 หรือ 500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">เรท OT ที่ทำ (ชั่วโมง)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <div><span class="text-xs text-slate-500">OT 1.5</span><input type="number" id="s-ot15" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                            <div><span class="text-xs text-slate-500">OT 2.0</span><input type="number" id="s-ot2" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                            <div><span class="text-xs text-slate-500">OT 3.0</span><input type="number" id="s-ot3" value="0" class="w-full px-2 py-2 border rounded-lg"></div>
                        </div>
                    </div>
                </div>
                <button onclick="calculateSingle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">คำนวณเงินค่าจ้าง</button>
                
                <div id="s-result" class="hidden mt-4 p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <h3 class="font-bold text-blue-900 mb-2">ผลการคำนวณ</h3>
                    <div id="s-result-text" class="text-sm text-blue-800 space-y-1"></div>
                </div>
            </div>
